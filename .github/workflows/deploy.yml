name: Deploy profile to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Unpack the website files
        run: |
          mkdir -p .site_extract _site
          unzip -q ALEXX_PROFILE_Website.zip -d .site_extract
          entry="$(find .site_extract -type f -name index.html -print -quit)"
          if [ -z "$entry" ]; then echo 'No index.html was found in the uploaded ZIP.'; exit 1; fi
          cp -R "$(dirname "$entry")"/. _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
