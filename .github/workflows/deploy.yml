name: Deploy profile to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Unpack the website files
        run: |
          mkdir -p .site_extract _site
          unzip -q ALEXX_PROFILE_Website.zip -d .site_extract
          entry="$(find .site_extract -type f -name index.html -print -quit)"
          if [ -z "$entry" ]; then echo 'No index.html was found in the uploaded ZIP.'; exit 1; fi
          cp -R "$(dirname "$entry")"/. _site/
      - name: Add peaceful video and drifting leaves
        run: |
          cat >> _site/index.html <<'HTML'
          <style>
          html,body,#root,.profile-page{background:transparent!important}
          body{position:relative!important;isolation:isolate}
          #root,.profile-page{position:relative;z-index:2;min-height:100vh;background:transparent!important}
          #ambient-video{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover;z-index:0;opacity:.48;filter:saturate(.72) brightness(1.03);pointer-events:none}
          #ambient-wash{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.78),rgba(250,248,255,.5))}
          .ambient-petal-field{position:fixed;inset:0;z-index:8;overflow:hidden;pointer-events:none}
          .ambient-petal{position:absolute;top:-12vh;width:var(--size);height:calc(var(--size)*1.32);left:var(--x);border-radius:88% 6% 88% 8%;background:linear-gradient(145deg,#fff,#f8f8f4d8);border:1px solid rgba(190,188,177,.48);box-shadow:0 2px 9px rgba(81,76,64,.12),inset 0 0 0 1px rgba(255,255,255,.78);opacity:0;animation:ambient-fall var(--duration) linear var(--delay) infinite}
          @keyframes ambient-fall{0%{opacity:0;transform:translate3d(0,-8vh,0) rotate(0)}12%{opacity:.74}55%{opacity:.64;transform:translate3d(var(--drift),58vh,0) rotate(390deg)}100%{opacity:0;transform:translate3d(calc(var(--drift)*1.4),116vh,0) rotate(760deg)}}
          .topbar{background:rgba(255,255,255,.78)!important;backdrop-filter:blur(18px)}
          .scene{background:transparent!important}
          .identity,.interest-card,.record-card,.connect-inner,.social-card{background:rgba(255,255,255,.78)!important;backdrop-filter:blur(18px)}
          @media(max-width:700px){#ambient-video{opacity:.28}#ambient-wash{background:rgba(255,255,255,.57)}}
          @media(prefers-reduced-motion:reduce){#ambient-video{display:none}.ambient-petal{animation-duration:48s!important}}
          </style>
          <script>
          (()=>{const add=()=>{if(document.getElementById('ambient-video'))return;const v=document.createElement('video');v.id='ambient-video';v.src='https://videos.pexels.com/video-files/5622115/5622115-uhd_3840_2160_30fps.mp4';v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';v.setAttribute('aria-hidden','true');v.tabIndex=-1;document.body.prepend(v);const wash=document.createElement('div');wash.id='ambient-wash';wash.setAttribute('aria-hidden','true');document.body.prepend(wash);const field=document.createElement('div');field.className='ambient-petal-field';field.setAttribute('aria-hidden','true');for(let i=0;i<24;i++){const p=document.createElement('span');p.className='ambient-petal';p.style.setProperty('--x',Math.random()*100+'vw');p.style.setProperty('--size',7+Math.random()*13+'px');p.style.setProperty('--duration',16+Math.random()*24+'s');p.style.setProperty('--delay',-Math.random()*32+'s');p.style.setProperty('--drift',(Math.random()*38-19)+'vw');field.appendChild(p)}document.body.appendChild(field);v.play().catch(()=>{})};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add,{once:true});else add()})();
          </script>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
